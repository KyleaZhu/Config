name: Update TURN

on:
  workflow_dispatch:

jobs:
  update-turn:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create and Run Script
        run: |
          cat << 'EOF' > check_turn.py
          import requests
          import re
          import os
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed

          INPUT_FILE = "bestcf/turn.txt"
          OUTPUT_FILE = "bestcf/turn.txt"
          CHECK_API_BASE = "https://check.socks5.cmliussss.net/check?proxy="

          def check_proxy(link):
              check_url = CHECK_API_BASE + urllib.parse.quote(link)
              try:
                  response = requests.get(check_url, timeout=15)
                  data = response.json()
                  
                  if data.get("success") is True:
                      exit_data = data.get("exit", {})
                      company_score = exit_data.get("company", {}).get("abuser_score", "")
                      
                      if "Low" in company_score:
                          location = exit_data.get("location", {})
                          country_code = location.get("country_code", "Unknown")
                          country = location.get("country", "Unknown")
                          response_time = data.get("responseTime", 999999) 
                          
                          formatted_link = f"{link}#{country_code}-{country}"
                          
                          return {
                              "responseTime": response_time,
                              "formatted_link": formatted_link
                          }
              except Exception:
                  pass
              return None

          def main():
              print(f"开始从 {INPUT_FILE} 读取并提取原始 TURN 节点...")
              if not os.path.exists(INPUT_FILE):
                  print(f"找不到输入文件: {INPUT_FILE}，脚本退出。")
                  return

              raw_links = []
              with open(INPUT_FILE, "r", encoding="utf-8") as f:
                  for line in f:
                      match = re.search(r'(turn://[0-9a-zA-Z\.\-_~%]+:[0-9]+)', line)
                      if match:
                          raw_links.append(match.group(1))

              raw_links = list(set(raw_links))
              print(f"成功提取并去重得到 {len(raw_links)} 个待测 TURN 节点。")

              if not raw_links:
                  print("未发现有效待测节点，脚本退出。")
                  return

              print("开始并发检测节点连通性和 IP 质量...")
              valid_nodes = []
              
              with ThreadPoolExecutor(max_workers=20) as executor:
                  future_to_link = {executor.submit(check_proxy, link): link for link in raw_links}
                  for future in as_completed(future_to_link):
                      result = future.result()
                      if result:
                          valid_nodes.append(result)
                          print(f"成功匹配节点: {result['formatted_link']} (延迟: {result['responseTime']}ms)")

              valid_nodes.sort(key=lambda x: x["responseTime"])
              final_lines = [node["formatted_link"] for node in valid_nodes]

              print(f"\n检测与筛选完成，共保留 {len(final_lines)} 个符合要求的节点。")

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  for line in final_lines:
                      f.write(line + "\n")
              print(f"结果已覆盖保存至 {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          EOF
          
          python check_turn.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add bestcf/turn.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "Manual update TURN: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit."
          fi
