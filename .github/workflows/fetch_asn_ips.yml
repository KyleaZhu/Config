name: Fetch ASN Prefixes

on:
  workflow_dispatch:
    inputs:
      asn:
        description: '请输入 ASN (例如: 906 或 AS906)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Process IP Prefixes
        run: |
          RAW_ASN="${{ github.event.inputs.asn }}"
          CLEAN_ASN="AS${RAW_ASN//[aA][sS]/}"
          
          echo "正在查询 ${CLEAN_ASN} 的 IP 段..."

          API_URL="https://stat.ripe.net/data/announced-prefixes/data.json?resource=${CLEAN_ASN}"
          RESPONSE=$(curl -s "$API_URL")

          mkdir -p bestcf

          echo "# IPv4 Prefixes for ${CLEAN_ASN}" > bestcf/ips.txt
          echo "$RESPONSE" | jq -r '.data.prefixes[].prefix | select(contains(":") | not)' >> bestcf/ips.txt

          echo "" >> bestcf/ips.txt

          echo "# IPv6 Prefixes for ${CLEAN_ASN}" >> bestcf/ips.txt
          echo "$RESPONSE" | jq -r '.data.prefixes[].prefix | select(contains(":"))' >> bestcf/ips.txt

          echo "提取完成！以下为生成的文件内容摘要："
          cat bestcf/ips.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add bestcf/ips.txt
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update IP prefixes for ${{ github.event.inputs.asn }}"
            git push
            echo "变动已成功推送到仓库！"
          else
            echo "IP 段未发生任何变化，无需提交。"
          fi
