name: Update Cloudflare Domain

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-cf-domain:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
    
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch API and Generate TXT
        run: |
          mkdir -p bestcf
          
          curl -skL "https://vps789.com/openApi/cfIpTop20" | jq -r '.data.good[].ip' | head -n 10 | while read -r ip; do
            if [ -n "$ip" ]; then
              echo "$ip:443#优选域名"
            fi
          done > bestcf/domain.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add bestcf/domain.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto update Domain: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Delete releases and workflows runs
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: false
          releases_keep_latest: 10
          delete_workflows: true
          workflows_keep_day: 1
          gh_token: ${{ secrets.GITHUB_TOKEN }}
